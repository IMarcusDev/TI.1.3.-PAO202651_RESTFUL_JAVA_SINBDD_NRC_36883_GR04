plugins {
    id 'com.android.application' version '9.4.0'
}

android {
    namespace = 'ec.edu.monster'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.espe.mov_con_uni_java_restful'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.filter.exclude('ec/edu/monster/pruebas/**')
        }
        test {
            java.srcDir('src/main/java/ec/edu/monster/pruebas')
        }
    }

    testOptions {
        unitTests.all {
            systemProperty 'servidor', project.findProperty('servidor') ?: ''
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
